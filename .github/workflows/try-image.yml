name: Try image

# Builds try/Dockerfile and pushes it as ghcr.io/isene/chasm-try, so
# anyone can run the desktop in a browser tab. The image installs the
# latest release, so a new release rebuilds it.

on:
  push:
    paths:
      - try/**
      - .dockerignore
      - .github/workflows/try-image.yml
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: try/Dockerfile
          push: true
          tags: ghcr.io/isene/chasm-try:latest
